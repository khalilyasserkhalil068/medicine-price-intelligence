name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q app.py run_dashboard.py run_streamlit.py utils pages dashboard
      - name: Validate notebooks and bundled dashboard data
        run: python scripts/validate_project.py
